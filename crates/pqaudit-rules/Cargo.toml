[package]
name = "pqaudit-rules"
description = "Part of pqaudit, the post-quantum cryptography audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
getrandom = { version = "0.4.3", optional = true }
include_dir = "0.7.4"
ml-dsa = "0.1.1"
pkcs8 = { version = "0.11.0", features = ["pem", "alloc"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
zstd = "0.14.3"

[dev-dependencies]
pqaudit-rules = { path = ".", features = ["signing"] }
tempfile = "3.27.0"

[features]
# Code that makes keys and signatures. Only the xtask and the tests use it.
signing = ["dep:getrandom"]
# Let a test replace the trust list. Never turn this on in a release build.
test-trust = []
