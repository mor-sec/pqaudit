[package]
name = "pqaudit-report"
description = "Part of pqaudit, the post-quantum cryptography audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
minijinja = { version = "3.0.1", features = ["serde"] }
pqaudit-core = { version = "0.1.0", path = "../pqaudit-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
uuid = { version = "1.28.0", features = ["v4"] }
