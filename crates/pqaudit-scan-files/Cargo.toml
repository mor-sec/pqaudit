[package]
name = "pqaudit-scan-files"
description = "Part of pqaudit, the post-quantum cryptography audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
p12-keystore = "0.4.1"
pqaudit-core = { version = "0.1.0", path = "../pqaudit-core" }
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
x509-parser = "0.18.1"
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
