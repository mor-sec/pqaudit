[package]
name = "pqaudit-core"
description = "Part of pqaudit, the post-quantum cryptography audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
getrandom = "0.4.3"
globset = "0.4.20"
hmac = "0.13.0"
ipnet = { version = "2.12.2", features = ["serde"] }
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
schemars = { version = "1.2.3", features = ["chrono04", "uuid1"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
x509-parser = "0.18.1"
zstd = "0.14.3"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3.27.0"
