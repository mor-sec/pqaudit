[package]
name = "pqaudit-scan-net"
description = "Part of pqaudit, the post-quantum cryptography audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
ipnet = { version = "2.12.2", features = ["serde"] }
pqaudit-core = { version = "0.1.0", path = "../pqaudit-core" }
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["net", "time", "sync", "io-util", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["net", "time", "sync", "io-util", "rt", "macros", "test-util", "rt-multi-thread"] }
