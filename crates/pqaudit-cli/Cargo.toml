[package]
name = "pqaudit-cli"
description = "The pqaudit command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pqaudit_cli"

[[bin]]
name = "pqaudit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
pqaudit-rules = { path = "../pqaudit-rules", features = ["signing", "test-trust"] }
tempfile = "3.27.0"
