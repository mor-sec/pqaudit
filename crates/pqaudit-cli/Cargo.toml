[package]
name = "pqaudit-cli"
description = "The pqaudit command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pqaudit_cli"

[[bin]]
name = "pqaudit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap.workspace = true
pqaudit-core = { version = "0.1.0", path = "../pqaudit-core" }
pqaudit-scan-net = { version = "0.1.0", path = "../pqaudit-scan-net" }
pqaudit-scan-files = { version = "0.1.0", path = "../pqaudit-scan-files" }
pqaudit-rules = { version = "0.1.0", path = "../pqaudit-rules" }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.28.0", features = ["v4"] }
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
pqaudit-rules = { path = "../pqaudit-rules", features = ["signing", "test-trust"] }
tempfile = "3.27.0"
