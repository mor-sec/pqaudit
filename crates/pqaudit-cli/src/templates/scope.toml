# The scope file. It is the only source of network targets.
# The command scan net connects only to the targets in this file.
# The tool refuses all other targets. This file has no targets now.
# So the command scan net does nothing until you add a target.

# If this value is true, each address of a host name must be in an allowed range.
# The default is true when the scope has a CIDR range. Otherwise the default is false.
# A scope with host names and no range is an error, unless this value is false.
# require_ip_in_cidr = true

# The address ranges that host names can resolve to. These ranges are not targets.
# The CIDR ranges of the targets are also allowed.
# A scope with host names needs this key or a CIDR target.
# allowed_cidrs = ["10.0.0.0/16"]

# The hours in which the tool can start. Use the local time.
# The window can cross midnight, for example "22:00-06:00".
# The tool does not start outside these hours.
# allowed_hours = "09:00-17:00"

# The default network limits are maximum values.
# To set a limit above its default, set this value to true.
# override_limits = false

# If this value is true, the tool makes one more TLS connection for each port.
# That connection checks for old protocol versions.
# legacy_tls_check = false

# The network limits. All keys are optional. The values here are the defaults.
# The interval is the least time between two connections to one host.
# [limits]
# concurrency = 4
# per_host = 1
# min_interval_ms = 1000
# tls_handshakes = 3
# connect_timeout_ms = 5000
# read_timeout_ms = 10000
# retries = 0

# A target is a host name, an IP address, or a CIDR range, with ports and a protocol.
# The protocol is tls or ssh. A CIDR range can have 256 addresses at most.
# Write each IP address in its canonical form, for example 10.0.0.1.
#
# A host name with one label needs a final dot.
# A host name must not resolve to a loopback, link-local, multicast, or unspecified address.
# To scan an address of this type, add it as an IP or CIDR target.
# [[target]]
# host = "pay.acme.example"
# ports = [443]
# protocol = "tls"

# [[target]]
# cidr = "10.0.1.0/28"
# ports = [22]
# protocol = "ssh"

# An exclusion has priority over a target. Use a host or a cidr key.
# [[exclude]]
# cidr = "10.0.1.5/32"
