# The scope file. It is the only source of network targets.
# The command scan net connects only to the targets in this file.
# The tool refuses all other targets. This file has no targets now.
# So the command scan net does nothing until you add a target.

# If this value is true, each address of a host name must be in an allowed range.
# The default is true when the scope has a CIDR range.
# require_ip_in_cidr = true

# The address ranges that host names can resolve to. These ranges are not targets.
# allowed_cidrs = ["10.0.0.0/16"]

# The hours in which the tool can start. Use the local time.
# The tool does not start outside these hours.
# allowed_hours = "09:00-17:00"

# The default network limits are maximum values.
# To set a limit above its default, set this value to true.
# override_limits = false

# A target is a host name or a CIDR range, with ports and a protocol.
# The protocol is tls or ssh.
# [[target]]
# host = "pay.acme.example"
# ports = [443]
# protocol = "tls"

# An exclusion has priority over a target. Use a host or a cidr key.
# [[exclude]]
# cidr = "10.0.1.5/32"
