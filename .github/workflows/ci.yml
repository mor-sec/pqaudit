name: ci

on:
  push:
  pull_request:

# CI reads the code only. The token can write nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked

  ste:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.23.0
      VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Vale
        run: |
          curl -sSL -o vale.tar.gz "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf vale.tar.gz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check the Vale rules with the fixtures
        run: |
          vale .github/vale/fixtures/good.md
          test "$(vale --output=line .github/vale/fixtures/bad.md | wc -l)" -eq 5
          test "$(vale --output=line .github/vale/fixtures/inflected.md | wc -l)" -eq 5
      - name: Extract the project text
        run: cargo --locked xtask strings --out target/ste --commits "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD"
      - name: Check the project text
        run: .github/scripts/ste-lint.sh

  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the crates of the file scanner
        run: cargo --locked xtask check-offline-deps
      - name: Build the program
        run: cargo build --locked -p pqaudit-cli
      - name: Install strace
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Make an engagement directory
        run: target/debug/pqaudit init ci --dir "$RUNNER_TEMP"
      - name: Trace the system calls of a file scan
        # The fixtures hold files that the scan cannot read, so exit code 3 (partial results) is normal.
        run: |
          code=0
          strace -f -e trace=socket,connect -o trace.txt \
            target/debug/pqaudit --engagement "$RUNNER_TEMP/ci" scan files crates/pqaudit-scan-files/tests/fixtures || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "The file scan stopped with exit code $code."
            exit 1
          fi
      - name: Check that the scan opened no network socket
        run: |
          if grep -E 'socket\(AF_INET|socket\(AF_INET6|connect\(' trace.txt; then
            echo "The file scan used the network."
            exit 1
          fi
