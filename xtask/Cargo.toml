[package]
name = "xtask"
description = "Build tasks for pqaudit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
sha2 = "0.11.1"
sha3 = "0.12.0"
toml = "1.1.8"
pqaudit-cli = { path = "../crates/pqaudit-cli" }
pqaudit-core = { path = "../crates/pqaudit-core" }
pqaudit-rules = { path = "../crates/pqaudit-rules", features = ["signing"] }
pqaudit-scan-files = { path = "../crates/pqaudit-scan-files" }
pqaudit-scan-net = { path = "../crates/pqaudit-scan-net" }
pqaudit-report = { path = "../crates/pqaudit-report" }

[dev-dependencies]
tempfile = "3.27.0"
jsonschema = { version = "0.59.0", default-features = false }
