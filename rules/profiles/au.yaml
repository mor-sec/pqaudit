name: Australia (ASD)
milestones:
  - date: 2030-12-31
    kind: migration
    applies_to: {tier: all}
    description: >-
      ASD recommends that organisations stop use of traditional asymmetric cryptography by the end of 2030.
      This includes RSA, DH, ECDH, and ECDSA.
